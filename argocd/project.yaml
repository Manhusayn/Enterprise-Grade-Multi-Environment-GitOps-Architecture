apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: enterprise-gitops
  namespace: argocd
spec:
  description: Enterprise multi-environment GitOps demo
  sourceRepos:
    - "*"
  destinations:
    - namespace: dev
      server: https://kubernetes.default.svc
    - namespace: stage
      server: https://kubernetes.default.svc
    - namespace: prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
