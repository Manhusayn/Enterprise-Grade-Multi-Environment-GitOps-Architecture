apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
namePrefix: dev-

commonLabels:
  environment: dev

patches:
  - target:
      kind: Namespace
      name: gitops-demo
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev
  - target:
      kind: Deployment
      name: gitops-demo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: dev
  - target:
      kind: Service
      name: gitops-demo
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-gitops-demo
